<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="scanner.css">
    <link rel="stylesheet" href="footer.css">



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>military app</title>
</head>

<body>
    <header class="header">
        <div id="logo-div">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z"/></svg>
        </div>
        <h3>SIGINT OPS</h3>
        <button class="header-button">
            secure online
        </button>
    </header>

    <main>
        <section>
            <section class="scan-section">
                <div class='radar'>
                    <div class='sweep'></div>
                </div>
                <div class="signals-div">
                    <h1>24</h1>
                    <span>ACTIVE SIGNALS</span>
                    <h1>07</h1>
                    <span>PRIORITY ALERTS</span>
                </div>

            </section>

            <section class="buttons-section">
                <button class="body-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px"
                        fill="#FFFFFF">
                        <path
                            d="m288-96 144-288-288-48 456-432h72L528-576l288 48L360-96h-72Zm182-204 191-180-241-41 70-139-191 181 241 40-70 139Zm10-180Z" />
                    </svg>
                    New Brief</button>
                <button class="body-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px"
                        fill="#FFFFFF">
                        <path
                            d="M336-240 96-480l240-240 51 51-189 189 189 189-51 51Zm288 0-51-51 189-189-189-189 51-51 240 240-240 240Z" />
                    </svg>
                    Decode</button>
                <button class="body-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px"
                        fill="#FFFFFF">
                        <path
                            d="m401-130-95-176-176-95 67-68 145 25 97-96-309-133 85-85 372 69 120-120q21-21 51-21t51 21q21 21 21 50.5T809-708L689-588l69 373-85 85-133-309-96 97 25 145-68 67Z" />
                    </svg>
                    Request Drone</button>



            </section>
            <section class="cards-section">
                <div class="wrap-div">
                    <section class="card">
                        <div class="top-div">
                            <div class="red-tag">CRITICAL</div>
                            <span>In Progress</span>
                        </div>
                        <div class="buttom-div">
                            <span>Operation Nightfall</span>
                            <div class="range-div">
                                <input type="range" min="0" max="100" value="65">
                                <span>65%</span>
                            </div>

                        </div>
                    </section>
                </div>
                <div class="wrap-div">
                    <section class="card">
                        <div class="top-div">
                            <div class="orange-tag">HIGH</div>
                            <span>Analyzing</span>
                        </div>
                        <div class="buttom-div">
                            <span>Signal Intercept Alpha</span>
                            <div class="range-div">
                                <input type="range" min="0" max="100" value="40">
                                <span>40%</span>
                            </div>

                        </div>
                    </section>
                </div>
                <div class="wrap-div">
                    <section class="card">
                        <div class="top-div">
                            <div class="green-tag">MEDIUM</div>
                            <span>Pending</span>
                        </div>
                        <div class="buttom-div">
                            <span>Asset Recovery</span>
                            <div class="range-div">
                                <input type="range" min="0" max="100" value="15">
                                <span>15%</span>
                            </div>

                        </div>
                    </section>
                </div>
                <div class="wrap-div">
                    <section class="card">
                        <div class="top-div">
                            <div class="orange-tag">HIGH</div>
                            <span>Active</span>
                        </div>
                        <div class="buttom-div">
                            <span>Cyber Defense Grid</span>
                            <div class="range-div">
                                <input type="range" min="0" max="100" value="80">
                                <span>80%</span>
                            </div>

                        </div>
                    </section>
                </div>
            </section>
            <section class="threat-section">
                <button class="threat-button">
                    <div class="red-circle"></div>THREAT DETECTED</button>
            </section>
    </main>
    <footer>
        <nav>
            <section class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px" fill="#999999"><path d="M328-203q-15-11-22-28l-86-213H48v-72h221l93 232 180-446q7-16.56 22-27.28Q579-768 598-768t34 11q15 11 22 28l86 213h172v72H692l-94-232-180 446q-7 16.56-22 27.28Q381-192 362-192t-34-11Z"/></svg>
<span>Dashboard</span>

           <span>Feed</span>
            </section>
            <section class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px" fill="#999999"><path d="M336-240h288v-72H336v72Zm0-144h288v-72H336v72ZM263.72-96Q234-96 213-117.15T192-168v-624q0-29.7 21.15-50.85Q234.3-864 264-864h312l192 192v504q0 29.7-21.16 50.85Q725.68-96 695.96-96H263.72ZM528-624v-168H264v624h432v-456H528ZM264-792v189-189 624-624Z"/></svg>
           <span>Brief</span>
            </section>
        </nav>
        <div id="questiom-mark-div">
            <svg xmlns="http://www.w3.org/2000/svg" height="19px" viewBox="24 -936 912 912" width="19px" fill="#999999"><path d="M428-360q0-72 14.5-107.5T503-543q43-37 58-59.5t15-50.5q0-38-27-62.5T480-740q-37 0-65 23t-40 63l-96-40q21-66 76.5-106T480-840q89 0 145 51.5T681-656q0 42-18.5 76.5T596-500q-41 38-50.5 60.5T535-360H428Zm52 216q-30 0-51-21t-21-51q0-30 21-51t51-21q30 0 51 21t21 51q0 30-21 51t-51 21Z"/></svg>
        </div>
    </footer>

</body>

</html>
